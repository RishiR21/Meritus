<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Banknote Base -->
  <rect x="2" y="6" width="28" height="20" rx="3.5" fill="url(#bill-grad)" stroke="#064e3b" stroke-width="0.75" />
  <rect x="2" y="6" width="28" height="9" rx="3.5" fill="url(#glow)" />
  
  <!-- Inner Engraved Border Frame -->
  <rect x="4" y="8" width="24" height="16" rx="2" fill="none" stroke="#d1fae5" stroke-width="0.85" opacity="0.9" />
  
  <!-- Corner Dots -->
  <circle cx="6" cy="10" r="0.75" fill="#ecfdf5" />
  <circle cx="26" cy="10" r="0.75" fill="#ecfdf5" />
  <circle cx="6" cy="22" r="0.75" fill="#ecfdf5" />
  <circle cx="26" cy="22" r="0.75" fill="#ecfdf5" />
  
  <!-- Center Medallion -->
  <circle cx="16" cy="16" r="5.25" fill="#065f46" stroke="#6ee7b7" stroke-width="0.85" />
  
  <!-- Currency Dollar Sign -->
  <text x="16" y="19.2" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
</svg>
